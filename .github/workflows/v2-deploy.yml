name: v2 deploy to VM

# Deployt de v2-stack naar de Server-setup VM. Twee modi:
#  - update (default): compose syncen + pull + up — draait na elke publish.
#  - bootstrap (workflow_dispatch met bootstrap=true): EERSTE deploy —
#    schrijft .env uit secrets, ontdekt het Caddy-netwerk, start de stack,
#    wiret de Caddy-import, pullt bge-m3 en trapt de kaart-sync af.
#
# Caddy-siteconfig (#379): de route van poracle.nl staat in de repo
# (deploy/server-setup-v2/caddy/poracle.caddy) en wordt bij elke deploy naar
# ~/compose/caddy/conf.d/ gesynct, gevalideerd en herladen — inclusief de
# TLS-keten-pin op ISRG Root X1. De workflow bewerkt de GEDEELDE Caddyfile
# nooit (die draagt ook andere sites; een globaal blok moet er bovendien als
# eerste in staan), behalve bij een bootstrap, waar hij eenmalig de
# import-regel toevoegt. De stap "Verifieer TLS-keten" leest daarna de
# werkelijk geserveerde keten uit: een geldige curl bewijst niets, want de
# cross-sign naar X1 verifieert prima terwijl bezoekers alsnog
# ERR_CERT_AUTHORITY_INVALID krijgen.
#
# Image-pinning (issue #45, :latest-race): twee parallelle publishes kunnen
# :latest in de verkeerde volgorde zetten (PR #83 miste daardoor tijdelijk op
# productie). Daarom pint deze workflow bij een workflow_run-trigger de
# :<commit-SHA>-tag van precies de publish die hem triggerde
# (workflow_run.head_sha; v2-ci.yml pusht die tag naast :latest). Route: één
# IMAGE_TAG-env, geëxporteerd op het SSH-commando — bewust NIET in de VM-.env
# geschreven, zodat die stateless blijft en handmatig `docker compose up -d`
# op de VM gewoon op :latest (compose-default) blijft draaien.
# Bij workflow_dispatch: input image_tag (default latest) — 'latest' voor de
# oude flow, of een commit-SHA om een specifieke build te (her)deployen.
#
# Job-gate (issue #45, derde praktijkvondst): de check op het merge-moment
# dekt het gat tot de daadwerkelijke deploy niet — een admin-job die tijdens
# de publish-doorlooptijd start werd alsnog afgebroken door de herstart.
# Daarom pollt de stap "Wacht op lopende admin-job" hier, vlak vóór
# 'compose up', de admin-status op de VM en wacht zolang er een job draait.
#
# Vereiste secrets:
#   DEPLOY_SSH_KEY   — private key voor sjoerd@20.123.137.64 (altijd)
#   POSTGRES_PASSWORD, NEO4J_PASSWORD, ADMIN_PASSWORD,
#   CLAUDE_CODE_OAUTH_TOKEN — voor bootstrap
# Zonder DEPLOY_SSH_KEY wordt de job netjes overgeslagen.
# DNS (poracle.nl → VM-IP, TransIP) blijft handmatig bij de registrar.
on:
  workflow_run:
    workflows: ["v2 CI & publish"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Eerste deploy: .env + Caddy-route + model + kickoff"
        type: boolean
        default: false
      image_tag:
        description: "Image-tag om te deployen (latest of een commit-SHA die v2-ci gepubliceerd heeft)"
        type: string
        default: "latest"
      renew_tls:
        description: "Gooi de certificaten van poracle.nl weg en laat ze opnieuw uitgeven (nodig na een wijziging in preferred_chains, #379)"
        type: boolean
        default: false

# Serialiseer deploys: vijf snelle merges gaven vijf racende runs met
# containernaam-conflicten op de VM (issue #45). Nieuwe runs wachten netjes
# op elkaar; cancel-in-progress: false zodat elke publish alsnog uitrolt.
concurrency:
  group: v2-deploy
  cancel-in-progress: false

env:
  VM_HOST: 20.123.137.64
  VM_USER: sjoerd
  VM_PATH: /home/sjoerd/compose/rb-rules-v2
  DOMAIN: poracle.nl
  # workflow_run → pin de commit-SHA van de triggerende publish;
  # workflow_dispatch → de image_tag-input (default latest).
  IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.image_tag || 'latest' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Valideer image-tag
        run: |
          # De tag belandt in een SSH-commando; alleen geldige Docker-tagtekens
          # toestaan (vangt ook een typefout in de dispatch-input vroeg af).
          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'; then
            echo "::error::ongeldige image-tag '$IMAGE_TAG'"
            exit 1
          fi
          echo "Deploy pint image-tag: $IMAGE_TAG (trigger: ${{ github.event_name }})"

      - name: Check secret
        id: check
        run: |
          if [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_SSH_KEY ontbreekt — deploy overgeslagen (voeg het secret toe om push-to-deploy te activeren)"
          fi

      - name: Set up SSH
        if: steps.check.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSHCMD=ssh -i ~/.ssh/id_deploy $VM_USER@$VM_HOST" >> "$GITHUB_ENV"

      - name: "Bootstrap: schrijf .env uit secrets"
        if: steps.check.outputs.enabled == 'true' && inputs.bootstrap == true
        run: |
          # Secrets-hygiëne (issue #45): geen hardcoded NEO4J_PASSWORD meer en
          # CLAUDE_CODE_OAUTH_TOKEN wordt óók gevalideerd — een bootstrap
          # zonder AI-token levert anders een stilletjes kreupele stack op.
          for s in POSTGRES_PASSWORD NEO4J_PASSWORD ADMIN_PASSWORD CLAUDE_CODE_OAUTH_TOKEN; do
            if [ -z "${!s:-}" ]; then echo "::error::secret $s ontbreekt (nodig voor bootstrap)"; exit 1; fi
          done
          # Caddy-netwerknaam op de VM ontdekken (niet raden)
          CADDY_NETWORK=$($SSHCMD "docker inspect caddy -f '{{range \$k, \$v := .NetworkSettings.Networks}}{{\$k}} {{end}}'" | awk '{print $1}')
          if [ -z "$CADDY_NETWORK" ]; then echo "::error::Caddy-netwerk niet gevonden op de VM"; exit 1; fi
          echo "Caddy-netwerk: $CADDY_NETWORK"

          cat > env.tmp <<EOF
          CADDY_NETWORK=$CADDY_NETWORK
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          NEO4J_PASSWORD=$NEO4J_PASSWORD
          NEO4J_HEAP_MAX=512m
          NEO4J_PAGECACHE=384m
          ADMIN_PASSWORD=$ADMIN_PASSWORD
          CLAUDE_CODE_OAUTH_TOKEN=$CLAUDE_CODE_OAUTH_TOKEN
          ANTHROPIC_API_KEY=
          EOF
          $SSHCMD "mkdir -p $VM_PATH"
          scp -i ~/.ssh/id_deploy env.tmp "$VM_USER@$VM_HOST:$VM_PATH/.env"
          rm env.tmp
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Sync compose file
        if: steps.check.outputs.enabled == 'true'
        run: |
          $SSHCMD "mkdir -p $VM_PATH"
          scp -i ~/.ssh/id_deploy \
            deploy/server-setup-v2/docker-compose.yml \
            "$VM_USER@$VM_HOST:$VM_PATH/docker-compose.yml"

      - name: Wacht op lopende admin-job
        # Bij bootstrap is er nog geen stack (en geen .env) om te bevragen.
        if: steps.check.outputs.enabled == 'true' && inputs.bootstrap != true
        run: |
          # Issue #45 (derde praktijkvondst): 'compose up' herstart rb-api en
          # breekt een lopende admin-job af. Poll daarom eerst de admin-status
          # (zelfde curl-in-intern-netwerk-patroon als de verify-stap) en
          # wacht — elke 30s, max ~20 min — tot er geen job meer draait.
          # Bewuste keuze: is rb-api onbereikbaar (bv. crash-loop van een
          # vorige deploy) of ontbreekt de .env, dan slaan we de gate over
          # met een notice in plaats van te falen — anders kan een
          # fix-forward-deploy nooit landen en zit productie muurvast.
          ADMIN_KEY=$($SSHCMD "grep '^ADMIN_PASSWORD=' $VM_PATH/.env | cut -d= -f2-" 2>/dev/null || true)
          if [ -z "$ADMIN_KEY" ]; then
            echo "::notice::geen ADMIN_PASSWORD in $VM_PATH/.env gevonden — job-gate overgeslagen (stack nog niet ge-bootstrapt?)"
            exit 0
          fi
          echo "::add-mask::$ADMIN_KEY"

          # /api/admin/status: compacte camelCase-JSON met top-level
          # "running":null (vrij) of "running":{"name":...} (job actief).
          probe() {
            $SSHCMD "docker run --rm --network rb-rules-v2_internal curlimages/curl:latest -fsS -m 10 -H 'X-Admin-Key: $ADMIN_KEY' http://rb-v2-api:8080/api/admin/status" 2>/dev/null
          }

          down=0
          for i in $(seq 1 40); do
            if body=$(probe); then
              down=0
              if printf '%s' "$body" | grep -q '"running":null'; then
                echo "OK: geen admin-job actief — deploy gaat door (poging $i)"
                exit 0
              fi
              job=$(printf '%s' "$body" | sed -n 's/.*"running":{"name":"\([^"]*\)".*/\1/p')
              echo "admin-job '${job:-onbekend}' draait — 30s wachten (poging $i/40)"
              sleep 30
            else
              # -fsS: ook een 401 (key geweigerd) telt als onbereikbaar; drie
              # opeenvolgende missers voordat we overslaan, zodat één hikje de
              # gate niet omzeilt terwijl er wél een job draait.
              down=$((down+1))
              if [ "$down" -ge 3 ]; then
                echo "::notice::rb-api onbereikbaar (of key geweigerd) — job-gate overgeslagen zodat een fix-forward-deploy kan landen"
                exit 0
              fi
              echo "admin-status antwoordt niet (misser $down/3) — 10s wachten"
              sleep 10
            fi
          done
          echo "::error::na ~20 min draait er nog steeds een admin-job — deploy afgebroken om de job niet te onderbreken. Herstart deze run zodra de job klaar is (of deploy via workflow_dispatch)."
          exit 1

      - name: Ruim oude images op vóór de pull (#164)
        if: steps.check.outputs.enabled == 'true'
        run: |
          # SHA-pinning (#86) stapelt per merge drie nieuwe images; zonder
          # opruimen loopt de 61GB root-disk vol (#164: de deploy faalde op
          # 'no space left on device' bij de pull). Vóór de pull ruimen we alle
          # images op die GEEN draaiende container gebruikt — de live versie is
          # daarbij beschermd, dus dit is veilig ook als het net misging — plus
          # de build-cache. Rollback pullt zo nodig opnieuw uit GHCR (de bron).
          # Best-effort: een opruimfout mag de deploy nooit breken.
          $SSHCMD "docker image prune -af || true; docker builder prune -af || true; echo '--- schijf na opruimen:'; df -h / | tail -1"

      - name: Pull & (re)start stack
        if: steps.check.outputs.enabled == 'true'
        run: |
          # Docker maakt de /mnt/data bind-mount-mappen zelf aan (daemon = root).
          # IMAGE_TAG via export op het SSH-commando: shell-env wint van de
          # .env-file bij compose-substitutie, dus pull én up gebruiken exact
          # de gepinde tag zonder dat er iets op de VM achterblijft.
          $SSHCMD "cd $VM_PATH && export IMAGE_TAG='$IMAGE_TAG' && docker compose --project-name rb-rules-v2 pull -q && docker compose --project-name rb-rules-v2 up -d && docker compose --project-name rb-rules-v2 ps"

      - name: Verifieer deploy
        if: steps.check.outputs.enabled == 'true'
        run: |
          # Issue #45: een deploy die niets verifieert is geen deploy. Wacht
          # tot rb-api én rb-web echt antwoorden (max ~3 min — EF-migraties
          # bij opstart kunnen even duren); anders faalt de run zichtbaar.
          verify() {
            $SSHCMD "docker run --rm --network rb-rules-v2_internal curlimages/curl:latest -fsS -m 10 -o /dev/null $1"
          }
          for i in $(seq 1 18); do
            if verify http://rb-v2-api:8080/health && verify http://rb-v2-web:3000/; then
              echo "OK: rb-api en rb-web antwoorden (poging $i)"
              exit 0
            fi
            echo "nog niet gezond (poging $i/18) — 10s wachten"
            sleep 10
          done
          echo "::error::rb-api of rb-web antwoordt niet na de deploy"
          $SSHCMD "cd $VM_PATH && docker compose --project-name rb-rules-v2 ps && docker compose --project-name rb-rules-v2 logs --tail 50 rb-api rb-web"
          exit 1

      - name: Sync Caddy-siteconfig
        if: steps.check.outputs.enabled == 'true'
        run: |
          # De siteconfig van poracle.nl leeft sinds #379 in de repo
          # (deploy/server-setup-v2/caddy/poracle.caddy) in plaats van als
          # handmatig blok in de centrale Caddyfile. Reden: die file bevat de
          # TLS-keten-pin op ISRG Root X1, en zulke dingen horen versiebeheerd
          # en reviewbaar te zijn — niet als eenmalige `>>`-append in een
          # bootstrap-stap die daarna nooit meer draait.
          #
          # HARDE GRENS: deze stap raakt de centrale Caddyfile NOOIT zelf aan.
          # Die file is gedeeld met andere sites op de VM, en een globaal blok
          # moet bovendien het eerste blok zijn — tekstchirurgie daarop vanuit
          # een workflow zet in het slechtste geval élke site op de VM plat.
          # Ontbreekt de import-regel, dan slaan we over met een notice en de
          # exacte handmatige stap.
          #
          # Alleen bij een bootstrap wiren we die import-regel één keer; bij
          # elke normale deploy blijft de gedeelde Caddyfile onaangeroerd.
          if [ "${{ inputs.bootstrap }}" = "true" ]; then
            $SSHCMD "mkdir -p ~/compose/caddy/conf.d"
            $SSHCMD "grep -qE '^[[:space:]]*import[[:space:]]+conf\.d/\*\.caddy' ~/compose/caddy/Caddyfile || printf '\nimport conf.d/*.caddy\n' >> ~/compose/caddy/Caddyfile"
            if $SSHCMD "grep -qE '^[[:space:]]*$DOMAIN' ~/compose/caddy/Caddyfile"; then
              echo "::warning::er staat nog een handmatig $DOMAIN-blok in ~/compose/caddy/Caddyfile. Haal dat weg — anders botst het met conf.d/poracle.caddy en weigert Caddy te laden."
            fi
          fi

          if ! $SSHCMD "grep -qE '^[[:space:]]*import[[:space:]]+conf\.d/\*\.caddy' ~/compose/caddy/Caddyfile" 2>/dev/null; then
            echo "::notice::~/compose/caddy/Caddyfile heeft geen 'import conf.d/*.caddy' — siteconfig-sync overgeslagen. Eenmalig op de VM: mkdir -p ~/compose/caddy/conf.d && echo 'import conf.d/*.caddy' >> ~/compose/caddy/Caddyfile && (het oude poracle.nl-blok eruit halen), daarna deze workflow opnieuw draaien."
            exit 0
          fi

          $SSHCMD "mkdir -p ~/compose/caddy/conf.d"
          # Back-up vóór elke wijziging: een kapotte siteconfig die Caddy niet
          # laadt is te herstellen, een weggeraakte niet.
          $SSHCMD "[ -f ~/compose/caddy/conf.d/poracle.caddy ] && cp ~/compose/caddy/conf.d/poracle.caddy ~/compose/caddy/conf.d/poracle.caddy.bak || true"
          scp -i ~/.ssh/id_deploy \
            deploy/server-setup-v2/caddy/poracle.caddy \
            "$VM_USER@$VM_HOST:/home/$VM_USER/compose/caddy/conf.d/poracle.caddy"

          # Ziet de CONTAINER de file ook? De import is relatief aan de
          # Caddyfile in de container, dus als alleen de Caddyfile zelf
          # gemount is (en niet de map eromheen) staat het bestand er wel op
          # de host maar bestaat het niet voor Caddy. Dat faalt anders pas bij
          # validate met een obscure melding, of — erger — laadt stil de oude
          # config door.
          if ! $SSHCMD "docker exec caddy test -f /etc/caddy/conf.d/poracle.caddy"; then
            echo "::error::/etc/caddy/conf.d/poracle.caddy bestaat niet in de caddy-container. De centrale Caddy mount waarschijnlijk alleen de Caddyfile en niet de map eromheen. Mount ~/compose/caddy op /etc/caddy (of voeg conf.d als tweede volume toe) en draai deze workflow opnieuw."
            $SSHCMD "[ -f ~/compose/caddy/conf.d/poracle.caddy.bak ] && mv ~/compose/caddy/conf.d/poracle.caddy.bak ~/compose/caddy/conf.d/poracle.caddy || true"
            exit 1
          fi

          # Valideren vóór reloaden. Faalt de validatie, dan de back-up
          # terugzetten en de deploy laten falen — nooit een reload op een
          # config waarvan we weten dat hij stuk is.
          if ! $SSHCMD "docker exec caddy caddy validate --config /etc/caddy/Caddyfile"; then
            echo "::error::Caddy-config ongeldig na de sync — back-up teruggezet, niets herladen"
            $SSHCMD "[ -f ~/compose/caddy/conf.d/poracle.caddy.bak ] && mv ~/compose/caddy/conf.d/poracle.caddy.bak ~/compose/caddy/conf.d/poracle.caddy || rm -f ~/compose/caddy/conf.d/poracle.caddy"
            exit 1
          fi
          $SSHCMD "docker exec caddy caddy reload --config /etc/caddy/Caddyfile"
          $SSHCMD "rm -f ~/compose/caddy/conf.d/poracle.caddy.bak"
          echo "Caddy-siteconfig gesynct, gevalideerd en herladen."

      - name: "Optioneel: certificaten opnieuw laten uitgeven"
        if: steps.check.outputs.enabled == 'true' && inputs.renew_tls == true
        run: |
          # BEWUST OPT-IN, nooit automatisch (#379). `preferred_chains` geldt
          # pas bij de VOLGENDE uitgifte: Caddy vervangt een nog geldig
          # certificaat niet, dus na het aanzetten van de pin blijft de oude
          # keten staan tot deze stap draait.
          #
          # En dit hoort géén onderdeel van elke deploy te zijn: Let's Encrypt
          # staat een beperkt aantal duplicaat-certificaten per week toe voor
          # dezelfde set namen. Bij elke merge weggooien betekent binnen een
          # dag helemaal geen certificaat meer — dat is een veel ergere storing
          # dan de storing die we repareren.
          ACME_DIR=/data/caddy/certificates/acme-v02.api.letsencrypt.org-directory
          for host in "$DOMAIN" "www.$DOMAIN"; do
            echo "verwijder cert voor $host"
            $SSHCMD "docker exec caddy rm -rf '$ACME_DIR/$host'" || true
          done
          $SSHCMD "docker restart caddy"
          echo "Caddy herstart; uitgifte loopt. De verificatiestap hieronder controleert de nieuwe keten."
          sleep 30

      - name: Verifieer TLS-keten
        if: steps.check.outputs.enabled == 'true' && inputs.bootstrap != true
        run: |
          # Permanente bewaking (#379). De aanleiding: Caddy kreeg een keten uit
          # Let's Encrypts nieuwe "Generation Y"-hiërarchie (Root YE / Root YR),
          # die nog in geen enkele grote trust store zit. Bezoekers kregen
          # ERR_CERT_AUTHORITY_INVALID terwijl een gewone `curl` "verify ok"
          # meldde — er is een cross-sign naar het vertrouwde ISRG Root X1, maar
          # lang niet elke client bouwt dat langere pad.
          #
          # De les die deze stap vastlegt: toets de KETEN, niet de exitcode.
          # Een geslaagde verbinding bewijst alleen dat de trust store van de
          # runner het pad vindt.
          fail=0
          for host in "$DOMAIN" "www.$DOMAIN"; do
            chain=$($SSHCMD "openssl s_client -connect '$host:443' -servername '$host' -showcerts </dev/null 2>/dev/null | grep -E '^ *i:'" || true)
            if [ -z "$chain" ]; then
              echo "::warning::kon de certificaatketen van $host niet uitlezen (openssl op de VM beschikbaar?) — keten niet geverifieerd"
              continue
            fi
            echo "--- keten $host:"
            printf '%s\n' "$chain"
            if printf '%s' "$chain" | grep -qE 'CN *= *Root Y[ER]'; then
              echo "::warning::$host serveert een keten via ISRG Root YE/YR — die roots zitten nog in geen enkele grote trust store en bezoekers krijgen ERR_CERT_AUTHORITY_INVALID. De pin staat in deploy/server-setup-v2/caddy/poracle.caddy, maar geldt pas bij de volgende uitgifte: draai deze workflow via workflow_dispatch met renew_tls=true."
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            echo "::notice::Deploy zelf is geslaagd; alleen de certificaatketen vraagt actie (zie waarschuwing hierboven)."
          else
            echo "OK: geen ketens via een niet-vertrouwde root."
          fi

      - name: "Bootstrap: embeddings-model en kickoff"
        if: steps.check.outputs.enabled == 'true' && inputs.bootstrap == true
        run: |
          # 1. Meertalig embeddingmodel (idempotent)
          $SSHCMD "cd $VM_PATH && docker compose --project-name rb-rules-v2 exec -T ollama ollama pull bge-m3"

          # 2. Kickoff: kaart-sync (secret komt uit de .env op de VM, niet uit
          #    de commandline van de runner). Daarna doet de scheduler de rest.
          #    De stack is hierboven al geverifieerd gezond.
          $SSHCMD "cd $VM_PATH && . ./.env && docker run --rm --network rb-rules-v2_internal curlimages/curl:latest -fsS -m 300 -X POST -H \"X-Admin-Key: \$ADMIN_PASSWORD\" http://rb-v2-api:8080/api/admin/cards/sync" || echo "::warning::kaart-sync-kickoff faalde — kan later via /admin"
