<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1114" />
		<!-- Géén statische <title> hier: elke route zet zijn eigen titel via
		     svelte:head, en een dubbele title-tag liet link-scrapers (WhatsApp)
		     rauwe HTML in de preview zetten (#353). -->
		<meta
			name="description"
			content="Riftbound-regels & vraagbaak — regels, bans, errata, rulings en kaarten, automatisch bijgehouden uit de officiële bronnen."
		/>
		<meta property="og:site_name" content="Poracle" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Poracle — Riftbound-regels & vraagbaak" />
		<meta
			property="og:description"
			content="Regels, bans, errata, rulings en kaarten — automatisch bijgehouden, met een AI-vraagbaak en printbare score pads."
		/>
		<meta property="og:url" content="https://poracle.nl" />
		<meta property="og:image" content="https://poracle.nl/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:locale" content="nl_NL" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="icon" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- Thema vóór de eerste verf zetten (#214): geen licht-flits als de
		     bezoeker donker koos. Alleen een expliciete keuze wint; anders volgt
		     app.css de OS-voorkeur (prefers-color-scheme). -->
		<script>
			try {
				var t = localStorage.getItem('rb-theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
